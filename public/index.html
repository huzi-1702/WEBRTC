<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <title>MeetLite</title>
  <link rel="icon" href="data:,">
  <style>
    #chat { margin: 12px 0; max-width: 600px; }
    #chatLog {
      height: 160px; overflow: auto; border: 1px solid #ccc; border-radius: 8px;
      padding: 8px; font-size: 14px; background: #fafafa;
    }
    .msg.mine { color: #0b57d0; }
    .msg.sys { color: #888; font-style: italic; }
    #chatRow { display: flex; gap: 8px; margin-top: 8px; }
    #chatInput { flex: 1; padding: 6px 8px; }

    body { font-family: system-ui, sans-serif; margin: 16px; }
    #roomInfo { margin-bottom: 12px; font-size: 14px; }
    .videos { display: flex; gap: 8px; flex-wrap: wrap; }
    .tile { position: relative; }
    .tile video { width: 280px; background: #000; border-radius: 8px; display: block; }
    .tile span {
      position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6);
      color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 4px;
    }
    #status { margin: 12px 0; font: 14px monospace; }
    #log {
      height: 280px; overflow: auto; background: #111; color: #0f0;
      font: 12px/1.5 monospace; padding: 8px; border-radius: 8px; white-space: pre-wrap;
    }
    button { margin-right: 8px; padding: 6px 12px; }
  </style>
</head>
<body>
  <div id="roomInfo"></div>

  <div class="videos" id="videos">
    <div class="tile">
      <video id="local" autoplay muted playsinline></video>
      <span>Bạn</span>
    </div>
  </div>

  <div id="status"></div>
  <div id="chat">
  <div id="chatLog"></div>
  <div id="chatRow">
    <input id="chatInput" placeholder="Nhập tin nhắn rồi nhấn Enter..." maxlength="500">
    <button id="btnSend">Gửi</button>
  </div>
</div>
  <div>
    <button id="btnSdp">In SDP ra log</button>
    <button id="btnClear">Xóa log</button>
  </div>
  <div id="log"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ---------- Phòng theo URL ----------
    const ROOM_RE = /^[a-zA-Z0-9_-]{1,32}$/;
    const params = new URLSearchParams(location.search);
    let room = params.get('room');
    let roomWasInvalid = false;
    if (!room || !ROOM_RE.test(room)) {
      roomWasInvalid = !!room;
      room = Math.random().toString(36).slice(2, 8);
      history.replaceState(null, '', '?room=' + room);
    }
    document.getElementById('roomInfo').innerHTML =
      `Phòng: <b>${room}</b> &nbsp; <button id="btnCopy">Sao chép link mời</button>`;
    document.getElementById('btnCopy').onclick = () => navigator.clipboard.writeText(location.href);

    const socket = io();
    const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];
    const peers = new Map(); // peerId -> { pc, pending, remoteSet }
    let localStream;

    // ---------- Debug Panel ----------
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const t0 = performance.now();
    const short = (id) => id.slice(0, 4);

    function log(tag, msg) {
      const ms = String(Math.round(performance.now() - t0)).padStart(6, ' ');
      const who = tag ? `[${short(tag)}] ` : '';
      logEl.textContent += `[+${ms} ms] ${who}${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }
    function parseCandidate(c) {
      const p = (c.candidate || '').split(' ');
      return { protocol: p[2], address: p[4], port: p[5], type: p[7] };
    }
    function renderStatus() {
      if (peers.size === 0) { statusEl.textContent = 'Chưa có người khác trong phòng'; return; }
      statusEl.textContent = [...peers].map(([id, p]) =>
        `${short(id)}: ice=${p.pc.iceConnectionState}, conn=${p.pc.connectionState}`
      ).join('  |  ');
    }
    renderStatus();
    // ---------- Chat qua DataChannel ----------
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');

function addChatMsg(name, text, mine) {
  const row = document.createElement('div');
  row.className = 'msg' + (mine ? ' mine' : '');
  const who = document.createElement('b');
  who.textContent = name + ': ';
  const body = document.createElement('span');
  body.textContent = text;            // textContent, không dùng innerHTML (chống XSS)
  row.append(who, body);
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function addSystemMsg(text) {
  const row = document.createElement('div');
  row.className = 'msg sys';
  row.textContent = text;
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function setupChannel(id, peer, dc) {
  peer.dc = dc;
  dc.onopen = () => {
    log(id, `DataChannel "${dc.label}" đã mở (id=${dc.id}, ordered=${dc.ordered})`);
    addSystemMsg(`${short(id)} đã kết nối chat`);
  };
  dc.onclose = () => log(id, 'DataChannel đã đóng');
  dc.onerror = (e) => log(id, 'DataChannel lỗi: ' + (e.error && e.error.message));
  dc.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type !== 'chat' || typeof msg.text !== 'string') return;
    // Giới hạn độ dài vì dữ liệu từ peer là dữ liệu không đáng tin
    addChatMsg(String(msg.name || short(id)).slice(0, 20), msg.text.slice(0, 500), false);
  };
}

function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  const payload = JSON.stringify({
    type: 'chat',
    name: socket.id ? short(socket.id) : 'Ẩn danh',
    text,
    ts: Date.now(),
  });
  let sent = 0;
  peers.forEach((p) => {
    if (p.dc && p.dc.readyState === 'open') { p.dc.send(payload); sent++; }
  });
  addChatMsg('Bạn', text, true);
  if (sent === 0) addSystemMsg('Chưa có ai nhận được tin nhắn (chưa có kết nối)');
  log(null, `Gửi chat tới ${sent} peer qua DataChannel`);
  chatInput.value = '';
}

document.getElementById('btnSend').onclick = sendChat;
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });


    document.getElementById('btnClear').onclick = () => { logEl.textContent = ''; };
    document.getElementById('btnSdp').onclick = () => {
      peers.forEach((p, id) => {
        log(id, '--- Local SDP ---\n' + (p.pc.localDescription ? p.pc.localDescription.sdp : '(chưa có)'));
        log(id, '--- Remote SDP ---\n' + (p.pc.remoteDescription ? p.pc.remoteDescription.sdp : '(chưa có)'));
      });
    };

    async function logSelectedPair(id, pc) {
      const stats = await pc.getStats();
      let pair;
      stats.forEach((r) => {
        if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') pair = r;
      });
      if (!pair) return log(id, 'Chưa tìm thấy candidate pair được chọn');
      const local = stats.get(pair.localCandidateId);
      const remote = stats.get(pair.remoteCandidateId);
      log(id, `Selected pair: local=${local.candidateType}/${local.protocol} <-> ` +
              `remote=${remote.candidateType}/${remote.protocol}, RTT=${pair.currentRoundTripTime}s`);
    }

    // ---------- Giao diện video ----------
    function attachVideo(id, stream) {
      let tile = document.getElementById('tile-' + id);
      if (!tile) {
        tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = 'tile-' + id;
        tile.innerHTML = `<video autoplay playsinline></video><span>${short(id)}</span>`;
        document.getElementById('videos').appendChild(tile);
      }
      tile.querySelector('video').srcObject = stream;
    }
    function removeTile(id) {
      const tile = document.getElementById('tile-' + id);
      if (tile) tile.remove();
    }

    // ---------- Tạo / xóa kết nối tới một người ----------
    function createPeer(id, isOfferer = false) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const peer = { pc, pending: [], remoteSet: false, dc: null };
  peers.set(id, peer);
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

  // DataChannel: bên tạo offer tạo kênh, bên trả answer nhận kênh
  if (isOfferer) {
    setupChannel(id, peer, pc.createDataChannel('chat'));
  } else {
    pc.ondatachannel = (e) => setupChannel(id, peer, e.channel);
  }

  pc.onsignalingstatechange = () => log(id, `signalingState: ${pc.signalingState}`);
  pc.onicegatheringstatechange = () => log(id, `iceGatheringState: ${pc.iceGatheringState}`);
  pc.oniceconnectionstatechange = () => { log(id, `iceConnectionState: ${pc.iceConnectionState}`); renderStatus(); };
  pc.onconnectionstatechange = () => {
    log(id, `connectionState: ${pc.connectionState}`);
    renderStatus();
    if (pc.connectionState === 'connected') logSelectedPair(id, pc);
  };
  pc.onicecandidate = (e) => {
    if (e.candidate) {
      const i = parseCandidate(e.candidate);
      log(id, `Local ICE candidate: type=${i.type} protocol=${i.protocol} address=${i.address}:${i.port}`);
      socket.emit('ice-candidate', { to: id, candidate: e.candidate });
    } else {
      log(id, 'Local ICE gathering finished');
    }
  };
  pc.ontrack = (e) => {
    log(id, `Nhận track từ xa: kind=${e.track.kind}`);
    attachVideo(id, e.streams[0]);
  };

  renderStatus();
  return peer;
}

    function removePeer(id) {
      const peer = peers.get(id);
      if (!peer) return;
      peer.pc.close();
      peers.delete(id);
      removeTile(id);
      renderStatus();
    }

    // ---------- Xếp hàng ICE candidate đến sớm ----------
    async function addRemoteCandidate(peer, c) {
      if (!peer.remoteSet) return peer.pending.push(c);
      try { await peer.pc.addIceCandidate(c); } catch (err) { log(null, 'addIceCandidate lỗi: ' + err); }
    }
    async function flushPending(peer) {
      peer.remoteSet = true;
      for (const c of peer.pending) await addRemoteCandidate(peer, c);
      peer.pending.length = 0;
    }

    // ---------- Signaling ----------
    socket.on('full', () => {
      log(null, 'Phòng đã đầy (tối đa 4 người)');
      statusEl.textContent = 'Phòng đã đầy (tối đa 4 người). Hãy đóng bớt một tab hoặc mở phòng mới.';
      localStream.getTracks().forEach((t) => t.stop()); // tắt camera/micro
      document.getElementById('local').srcObject = null;
    });

    socket.on('invalid-room', () => log(null, 'Server từ chối mã phòng không hợp lệ'));   // <-- DÒNG MỚI

    // Người mới vào: tạo offer cho từng người đang có trong phòng
    socket.on('room-users', async (ids) => {
      log(null, `Trong phòng đang có ${ids.length} người khác`);
      for (const id of ids) {
        const peer = createPeer(id, true);
        const offer = await peer.pc.createOffer();
        await peer.pc.setLocalDescription(offer);
        log(id, 'Gửi offer');
        socket.emit('offer', { to: id, sdp: offer });
      }
    });

    socket.on('offer', async ({ from, sdp }) => {
      log(from, 'Nhận offer, tạo answer');
      const peer = peers.get(from) || createPeer(from);
      await peer.pc.setRemoteDescription(sdp);
      await flushPending(peer);
      const answer = await peer.pc.createAnswer();
      await peer.pc.setLocalDescription(answer);
      socket.emit('answer', { to: from, sdp: answer });
    });

    socket.on('answer', async ({ from, sdp }) => {
      const peer = peers.get(from);
      if (!peer) return;
      log(from, 'Nhận answer');
      await peer.pc.setRemoteDescription(sdp);
      await flushPending(peer);
    });

    socket.on('ice-candidate', ({ from, candidate }) => {
      const peer = peers.get(from);
      if (!peer) return;
      const i = parseCandidate(candidate);
      log(from, `Remote ICE candidate: type=${i.type} protocol=${i.protocol} address=${i.address}:${i.port}`);
      addRemoteCandidate(peer, candidate);
    });

    socket.on('peer-left', (id) => {
      log(id, 'Đã rời phòng, đóng kết nối');
      removePeer(id);
    });

    // ---------- Khởi động ----------
    (async () => {
      if (roomWasInvalid) log(null, 'Mã phòng trong URL không hợp lệ, đã tạo phòng mới: ' + room);
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('local').srcObject = localStream;
      log(null, 'Đã lấy camera/micro, vào phòng: ' + room);
      socket.emit('join', room);
    })();
  </script>
</body>
</html>
